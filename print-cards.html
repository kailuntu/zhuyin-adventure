<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>列印注音字卡｜注音探險</title><link rel="stylesheet" href="./print-cards.css"></head>
<body>
<header class="controls">
  <a href="./index.html">← 回到注音探險</a>
  <h1>把注音好朋友帶回家</h1>
  <p>37 張注音符號字卡，每張都有代表寶可夢。A4 每頁 6 張，共 7 頁，沿虛線剪下即可練習。</p>
  <p>請選擇 A4、直向、縮放 100%，關閉頁首與頁尾。目的地選「另存為 PDF」即可匯出；手機也可透過列印選單儲存 PDF。</p>
  <button id="print" disabled>列印／匯出 PDF</button> <button id="retry" hidden>重新載入</button>
  <p id="status" role="status" aria-live="polite">正在準備字卡與圖片…</p>
  <p class="hint">練習方式：先認符號，再找名字裡標示的字，回到網站聽示範。符號只是字音的一部分，完整字音仍要加上其他符號與聲調。</p>
</header>
<main id="pages" aria-label="注音字卡列印預覽"></main>
<script type="module" src="./print-cards.js"></script>
</body></html>
